name: Test and build wishlist

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: wishlist-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: true
      - run: make check
      - run: make linux-amd64 VERSION=${GITHUB_SHA}
      - uses: actions/upload-artifact@v4
        with:
          name: wishlist-linux-amd64
          path: dist/wishlist-linux-amd64
          if-no-files-found: error
          retention-days: 14
