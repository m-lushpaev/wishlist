{{define "admin.html"}}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вишлисты · управление</title>
<link rel="stylesheet" href="/styles.css?v=family-1">
</head>
<body>
<main>
<header>
<p class="eyebrow">управление · {{.User}}</p>
<h1>Семейные вишлисты</h1>
<p>Выберите, чей список хотите изменить.</p>
</header>
<nav class="profiles" aria-label="Доступные профили">{{range .Profiles}}<a class="profile-card" href="/admin/{{.Slug}}">
<span class="profile-name">{{.Name}}</span>
<span aria-hidden="true">↗</span>
</a>{{end}}</nav>
</main>
</body>
</html>{{end}}
